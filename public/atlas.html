<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Idemap — 2D Orbital Solar System Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s);"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --void: #0D0F0E;
      --hud-bg: rgba(15, 19, 21, 0.9);
      --border-cyan: rgba(45, 212, 191, 0.24);
      --cyan: #2DD4BF;
      --gold: #E5A93C;
    }
    html { font-size: 16px; }
    @media (min-width: 1280px) { html { font-size: 17px; } }
    @media (min-width: 1536px) { html { font-size: 18px; } }
    @media (min-width: 1920px) { html { font-size: 19.5px; } }
    html, body { height: 100%; }
    body {
      background-color: var(--void);
      color: #F1F5F9;
      font-family: 'Outfit', sans-serif;
      margin: 0;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    input, textarea, select { color-scheme: dark; user-select: text; -webkit-user-select: text; }
    .font-fraunces { font-family: 'Fraunces', serif; }

    /* Stationary HUD panels are the ONLY elements allowed to use backdrop-filter (GPU budget). */
    .hud-panel {
      background: linear-gradient(var(--hud-bg), var(--hud-bg)) padding-box,
                  linear-gradient(160deg, rgba(45, 212, 191, 0.45), rgba(45, 212, 191, 0.08) 40%, rgba(229, 169, 60, 0.18)) border-box;
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid transparent;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 0 40px rgba(45, 212, 191, 0.04), 0 24px 60px rgba(0, 0, 0, 0.6);
      border-radius: 1rem;
    }
    .hud-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .hud-scroll::-webkit-scrollbar-thumb { background: rgba(45, 212, 191, 0.3); border-radius: 2px; }

    @keyframes glow-pulse {
      0%   { filter: brightness(1) drop-shadow(0 0 8px currentColor); transform: scale(1); }
      45%  { filter: brightness(1.9) drop-shadow(0 0 30px currentColor); transform: scale(1.08); }
      100% { filter: brightness(1) drop-shadow(0 0 8px currentColor); transform: scale(1); }
    }
    .planet-glow-pulse { animation: glow-pulse 0.45s ease-out; }

    @keyframes strain-pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    .strain-pulse { animation: strain-pulse 1.8s ease-in-out infinite; }

    @keyframes arc-drift { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -32; } }
    .arc-animated { stroke-dasharray: 6 10; animation: arc-drift 2.6s linear infinite; }

    @keyframes spin-slow { to { transform: rotate(360deg); } }
    .reticle { animation: spin-slow 14s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .reticle, .arc-animated, .planet-glow-pulse, .strain-pulse { animation: none !important; }
    }

    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px rgba(94, 234, 212, 0.6);
    }

    /* Node telemetry pills: crisp readability with subtle hover elevation */
    .node-pill { opacity: 0.92; transition: opacity .2s ease, transform .2s ease, border-color .2s ease; }
    .node-inner:hover .node-pill, .is-selected .node-pill, .pill-always .node-pill { opacity: 1; border-color: rgba(45, 212, 191, 0.35); }

    @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
    .toast-show { animation: toast-in .25s ease-out; }

    @keyframes fade-up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .fade-up { animation: fade-up .25s ease-out; }

    /* Responsive split & Mobile Polish */
    .mob-only { display: none; }
    @media (max-width: 767px) {
      .desk-only { display: none !important; }
      .mob-only { display: block; }
      #mobileHeader.mob-only { display: flex; }
      .node-inner:not(.is-selected):not(.pill-always) .node-label { display: none; }
    }
    @media (min-width: 768px) {
      .mob-only { display: none !important; }
    }
    .safe-top { padding-top: max(12px, env(safe-area-inset-top)); }
    .safe-bottom { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
    .safe-left { padding-left: max(16px, env(safe-area-inset-left)); }
    .safe-right { padding-right: max(16px, env(safe-area-inset-right)); }

    /* Ultra-Modern Glassmorphism Surfaces */
    .glass-surface {
      background: rgba(13, 17, 18, 0.82);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }
    .glass-dock {
      background: rgba(11, 14, 15, 0.92);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border-top: 1px solid rgba(45, 212, 191, 0.22);
      box-shadow: 0 -8px 36px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body class="relative w-screen h-screen">

  <!-- Layer 0: Deep Space Background Canvas -->
  <canvas id="spaceCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

  <!-- Layer 1: Orbital Arcs SVG (persistent nodes, mutated per frame) -->
  <svg id="orbitalArcSvg" class="absolute inset-0 w-full h-full pointer-events-none z-10"></svg>

  <!-- Layer 2: DOM Celestial Planet Nodes -->
  <div id="planetCanvas" class="absolute inset-0 z-20 pointer-events-none"></div>

  <!-- Mobile Floating Glass Header -->
  <header id="mobileHeader" class="mob-only fixed top-0 inset-x-0 z-40 px-3.5 pt-3 pb-2.5 bg-[#0B0E0F]/85 backdrop-blur-2xl border-b border-white/10 safe-top items-center justify-between gap-2 shadow-lg pointer-events-auto">
    <div class="flex items-center gap-1.5 min-w-0 flex-1">
      <button data-act="dive" data-id="" class="flex items-center gap-1.5 flex-shrink-0 cursor-pointer">
        <div class="w-8 h-8 rounded-full bg-teal-400/15 border border-teal-400/40 flex items-center justify-center leading-none">
          <span class="text-teal-300 text-sm leading-none">✦</span>
        </div>
        <span class="font-fraunces font-semibold text-lg text-white leading-snug">Idemap</span>
      </button>
      <div id="mobBreadcrumbs" class="flex items-center gap-1 text-xs text-slate-300 min-w-0 overflow-hidden"></div>
    </div>
    <div class="flex items-center gap-1.5 flex-shrink-0">
      <button data-act="sync-cloud" id="mobBtnCloudSync" class="px-2.5 py-1 rounded-full text-[11px] font-medium border border-teal-400/35 bg-teal-400/10 text-teal-200 transition-all cursor-pointer whitespace-nowrap" title="Persistence status">💾 Local Mode</button>
      <button data-act="sound" id="mobBtnSound" class="w-7 h-7 rounded-full border border-white/15 text-xs flex items-center justify-center text-slate-200 cursor-pointer leading-none">🔊</button>
      <button data-act="auth-btn" id="mobBtnAuth" class="px-2.5 py-1 rounded-full text-[11px] font-medium border border-amber-400/40 bg-amber-400/10 text-amber-200 cursor-pointer whitespace-nowrap">👤</button>
    </div>
  </header>

  <!-- Layer 3: Desktop Top HUD -->
  <header class="desk-only fixed top-6 left-6 right-[440px] xl:right-[505px] 2xl:right-[555px] z-40 flex flex-wrap items-center gap-3 pointer-events-none">
    <div class="hud-panel h-12 px-4 flex items-center gap-3.5 pointer-events-auto shadow-2xl">
      <button data-act="dive" data-id="" class="flex items-center gap-2.5 cursor-pointer group">
        <div class="w-8 h-8 rounded-full bg-teal-400/10 border border-teal-400/35 flex items-center justify-center group-hover:border-teal-400 transition-colors">
          <span class="text-teal-400 text-sm leading-none">✦</span>
        </div>
        <span class="text-xl font-semibold tracking-wide font-fraunces text-slate-100 group-hover:text-teal-300 transition-colors leading-none">Idemap</span>
      </button>
      <div class="h-5 w-[1px] bg-teal-400/20 mx-0.5"></div>
      <nav id="breadcrumbNav" class="flex items-center gap-1.5"></nav>
    </div>
    <div class="hud-panel h-12 px-3 flex items-center gap-2 pointer-events-auto relative">
      <button data-act="sync-cloud" id="btnCloudSync" class="px-3.5 py-1.5 rounded-full text-sm font-medium border border-teal-400/35 bg-teal-400/10 text-teal-200 hover:border-teal-400 transition-all cursor-pointer" title="Persistence status">💾 Local Mode</button>
      <button data-act="sound" id="btnSoundToggle" class="px-3.5 py-1.5 rounded-full text-sm font-medium border border-white/15 hover:border-teal-400/50 text-teal-300 transition-all cursor-pointer">🔊 Audio On</button>
      <button data-act="auth-btn" id="btnAuthUser" class="px-3.5 py-1.5 rounded-full text-sm font-medium border border-amber-400/40 bg-amber-400/10 hover:bg-amber-400/20 text-amber-200 transition-all cursor-pointer">👤 Sign In</button>
      <div class="relative">
        <button data-act="top-menu" id="btnTopMenu" class="w-8 h-8 rounded-full border border-white/15 hover:border-teal-400/50 text-slate-300 hover:text-white flex items-center justify-center transition-all cursor-pointer text-sm leading-none" title="More options" aria-label="More options">⋯</button>
        <div id="topOverflowMenu" class="hidden absolute right-0 top-full mt-2 w-48 hud-panel p-1.5 z-50 shadow-2xl">
          <button data-act="reset" class="w-full px-3 py-2 rounded-lg text-xs font-medium text-left text-red-300 hover:bg-red-500/15 flex items-center gap-2 cursor-pointer transition-colors" title="Reset to the 4 empty seed planets">
            <span>↺</span><span>Reset to Seed Planets</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Full-Screen User Login Overlay -->
  <div id="loginScreen" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-[#0D0F0E]/85 backdrop-blur-xl overflow-y-auto">
    <div class="hud-panel glass-surface p-6 sm:p-8 w-full max-w-md space-y-5 sm:space-y-6 shadow-[0_0_80px_rgba(45,212,191,0.18)] border border-teal-400/30 fade-up my-auto">
      <div class="text-center space-y-2">
        <div class="mx-auto w-16 h-16 rounded-full bg-teal-400/10 border border-teal-400/40 flex items-center justify-center shadow-[0_0_30px_rgba(45,212,191,0.3)]">
          <span class="text-teal-300 text-3xl">✦</span>
        </div>
        <h1 class="text-3xl font-semibold font-fraunces text-white tracking-wide pt-1">Idemap</h1>
        <p class="text-sm text-slate-300">2D Orbital Solar System Life RPG Atlas</p>
      </div>

      <!-- Primary Google OAuth Button -->
      <div class="space-y-3">
        <button data-act="login-google" class="w-full py-3.5 px-5 rounded-full bg-white hover:bg-slate-100 text-slate-900 font-semibold text-base flex items-center justify-center gap-3 shadow-lg hover:scale-[1.01] transition-all cursor-pointer">
          <svg width="20" height="20" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>Continue with Google</span>
        </button>

        <div id="authErrorBox" class="hidden p-3.5 rounded-xl bg-amber-500/10 border border-amber-400/40 text-xs text-amber-200 leading-relaxed"></div>
      </div>

      <div class="flex items-center gap-3">
        <div class="h-px flex-1 bg-white/10"></div>
        <span class="text-xs uppercase tracking-wider text-slate-400">or email access</span>
        <div class="h-px flex-1 bg-white/10"></div>
      </div>

      <!-- Email / Password Sign-in & Sign-up -->
      <div class="space-y-2.5">
        <input id="inputAuthEmail" type="email" placeholder="you@example.com" class="w-full bg-white/5 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-teal-400">
        <input id="inputAuthPass" type="password" placeholder="Password (min 6 chars)" class="w-full bg-white/5 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-teal-400">
        <div class="flex gap-2 pt-1">
          <button data-act="login-email" class="flex-1 py-2.5 rounded-full text-sm font-semibold text-neutral-900 cursor-pointer hover:brightness-110" style="background:var(--gold)">Sign In</button>
          <button data-act="signup-email" class="flex-1 py-2.5 rounded-full text-sm font-semibold border border-teal-400/45 bg-teal-400/15 text-teal-200 hover:bg-teal-400/25 cursor-pointer">Create Account</button>
        </div>
      </div>

      <div class="pt-1 text-center">
        <button data-act="login-guest" class="text-xs text-slate-400 hover:text-teal-300 underline cursor-pointer">Continue in Guest Mode (Local-only, no cloud sync)</button>
      </div>
    </div>
  </div>

  <!-- Layer 4: Desktop bottom-left compass -->
  <div class="desk-only fixed bottom-6 left-6 z-30">
    <div class="hud-panel px-5 py-3 flex items-center gap-4 text-sm text-slate-200">
      <div class="flex items-center gap-2">
        <span class="text-teal-400 text-base">🧭</span>
        <span class="text-slate-300">Focus:</span>
        <span id="compassFocusName" class="text-white font-semibold text-base font-fraunces">Life</span>
      </div>
      <span class="text-slate-600">|</span>
      <button data-act="pause" id="btnPauseOrbit" class="px-3 py-1 rounded-full bg-white/5 hover:bg-teal-400/15 border border-white/15 text-slate-200 hover:text-teal-300 transition-all cursor-pointer font-medium">⏸ Pause Orbit</button>
    </div>
  </div>

  <!-- Layer 5: Desktop Right Inspector Drawer (rendered by renderHUD) -->
  <aside id="telemetryPanel" class="desk-only hud-panel fixed right-6 top-6 bottom-6 w-[400px] xl:w-[465px] 2xl:w-[515px] z-40 flex flex-col overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.8)]"></aside>

  <!-- Mobile dynamic view container (rendered by renderMobile) -->
  <div id="mobileView" class="mob-only fixed inset-0 z-30"></div>

  <!-- Toast -->
  <div id="toast" class="fixed left-1/2 bottom-24 md:bottom-8 z-[70] hidden px-5 py-2.5 rounded-full bg-[#0B0E0F] border border-teal-400/35 text-base font-medium text-slate-100 shadow-[0_0_30px_rgba(45,212,191,0.25)] whitespace-nowrap" style="transform:translateX(-50%)"></div>

  <!-- Planet Forge / Customize Modal (Responsive Bottom Sheet on Mobile) -->
  <div id="forgeModal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="hud-panel glass-surface p-0 w-full sm:max-w-md max-h-[90vh] sm:max-h-[85vh] rounded-t-3xl sm:rounded-2xl flex flex-col overflow-hidden fade-up">
      <div class="p-5 sm:p-6 pb-3 flex justify-between items-center border-b border-white/10 flex-shrink-0">
        <div>
          <p id="forgeTargetLabel" class="text-xs uppercase tracking-wider text-teal-400 font-semibold">Orbiting Life</p>
          <h3 id="forgeModalTitle" class="text-xl sm:text-2xl font-semibold text-slate-100 font-fraunces mt-0.5">Launch Celestial Node</h3>
        </div>
        <button data-act="close-modal" data-modal="forgeModal" class="w-9 h-9 rounded-full text-slate-300 hover:text-white hover:bg-white/10 cursor-pointer text-base flex items-center justify-center">✕</button>
      </div>
      <div class="p-5 sm:p-6 overflow-y-auto flex-1 hud-scroll space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Planet Name</label>
          <input id="inputForgeName" type="text" maxlength="40" placeholder="Sector / Planet name…" class="w-full bg-white/5 border border-slate-700 rounded-xl px-4 py-2.5 text-base text-slate-100 focus:outline-none focus:border-teal-400">
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <p class="text-xs font-medium text-slate-300">Emoji / Emblem</p>
            <div class="flex items-center gap-1.5">
              <span class="text-xs text-slate-400">Custom:</span>
              <input id="inputForgeCustomIcon" type="text" maxlength="4" placeholder="🪐" class="w-12 bg-white/5 border border-slate-700 rounded-lg px-2 py-1 text-center text-base text-slate-100 focus:outline-none focus:border-teal-400">
            </div>
          </div>
          <div id="forgeIcons" class="flex flex-wrap gap-1.5"></div>
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <p class="text-xs font-medium text-slate-300">Planet Color</p>
            <label class="flex items-center gap-1.5 text-xs text-slate-400 cursor-pointer hover:text-slate-200">
              <span>Custom hex:</span>
              <input id="inputForgeCustomColor" type="color" value="#3B7A57" class="w-7 h-7 rounded cursor-pointer bg-transparent border-0 p-0">
            </label>
          </div>
          <div id="forgeColors" class="flex flex-wrap gap-2"></div>
        </div>
      </div>
      <div class="p-5 sm:p-6 pt-3 border-t border-white/10 bg-[#0B0E0F]/95 flex gap-3 flex-shrink-0 safe-bottom">
        <button data-act="forge-confirm" id="btnForgeConfirm" class="flex-1 py-3 rounded-full text-base font-semibold text-neutral-900 cursor-pointer hover:brightness-110 shadow-lg" style="background:var(--gold)">Launch into Orbit</button>
        <button data-act="del-planet" id="btnForgeDelete" class="hidden px-4 py-3 rounded-full text-sm font-medium border border-red-500/40 bg-red-500/15 hover:bg-red-500/25 text-red-300 cursor-pointer" title="Delete planet">🗑 Delete</button>
        <button data-act="close-modal" data-modal="forgeModal" class="px-5 py-3 rounded-full text-base border border-slate-700 text-slate-200 cursor-pointer">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Add / Edit Task Modal (Responsive Bottom Sheet on Mobile) -->
  <div id="taskModal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="hud-panel glass-surface p-0 w-full sm:max-w-lg max-h-[90vh] sm:max-h-[85vh] rounded-t-3xl sm:rounded-2xl flex flex-col overflow-hidden fade-up">
      <div class="p-5 sm:p-6 pb-3 flex justify-between items-center border-b border-white/10 flex-shrink-0">
        <div>
          <p class="text-xs uppercase tracking-wider text-teal-400 font-semibold">Mission Directive</p>
          <h3 id="taskModalTitle" class="text-xl sm:text-2xl font-semibold text-slate-100 font-fraunces mt-0.5">Add Task</h3>
        </div>
        <button data-act="close-modal" data-modal="taskModal" class="w-9 h-9 rounded-full text-slate-300 hover:text-white hover:bg-white/10 cursor-pointer text-base flex items-center justify-center">✕</button>
      </div>
      <div class="p-5 sm:p-6 overflow-y-auto flex-1 hud-scroll space-y-3.5">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Task title</label>
          <input id="inputTaskTitle" type="text" maxlength="120" placeholder="What needs doing?" class="w-full bg-white/5 border border-slate-700 rounded-xl px-4 py-2.5 text-base text-slate-100 focus:outline-none focus:border-teal-400">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Planet</label>
            <select id="selectTaskPlanet" class="w-full bg-[#121719] border border-slate-700 rounded-xl px-3 py-2.5 text-sm xl:text-base text-slate-100 focus:outline-none focus:border-teal-400"></select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Repeat / Recurrence</label>
            <select id="selectTaskRecur" class="w-full bg-[#121719] border border-slate-700 rounded-xl px-3 py-2.5 text-sm xl:text-base text-slate-100 focus:outline-none focus:border-teal-400">
              <option value="">One-time task</option>
              <option value="daily">↻ Daily</option>
              <option value="weekdays">↻ Weekdays (Mon–Fri)</option>
              <option value="weekly">↻ Weekly</option>
              <option value="monthly">↻ Monthly</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Difficulty</label>
            <select id="selectTaskDiff" class="w-full bg-[#121719] border border-slate-700 rounded-xl px-3 py-2.5 text-sm xl:text-base text-slate-100 focus:outline-none focus:border-teal-400">
              <option value="1">1 · Trivial (5 XP)</option>
              <option value="2" selected>2 · Routine (20 XP)</option>
              <option value="3">3 · Focused (45 XP)</option>
              <option value="4">4 · Demanding (80 XP)</option>
              <option value="5">5 · Epic (125 XP)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">Due date</label>
            <input id="inputTaskDue" type="date" class="w-full bg-[#121719] border border-slate-700 rounded-xl px-3 py-2 text-sm xl:text-base text-slate-100 focus:outline-none focus:border-teal-400">

          <button data-act="due-quick" data-days="7" class="px-3 py-1 rounded-full text-xs border border-white/15 text-slate-200 hover:border-teal-400/50 cursor-pointer">Next week</button>
          <button data-act="due-quick" data-days="" class="px-3 py-1 rounded-full text-xs border border-white/15 text-slate-300 hover:border-teal-400/50 cursor-pointer">No date</button>
        </div>
      </div>
      <div class="p-5 sm:p-6 pt-3 border-t border-white/10 bg-[#0B0E0F]/95 flex gap-3 flex-shrink-0 safe-bottom">
        <button data-act="task-confirm" id="btnConfirmTask" class="flex-1 py-3 rounded-full text-base font-semibold text-neutral-900 cursor-pointer hover:brightness-110 shadow-lg" style="background:var(--gold)">Add Task</button>
        <button data-act="close-modal" data-modal="taskModal" class="px-5 py-3 rounded-full text-base border border-slate-700 text-slate-200 cursor-pointer">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 0. Utilities
    // =========================================================================
    const DAY = 86400000;
    const BASE_STORE_KEY = "idemap-atlas-v2";
    let currentUser = null;
    let guestMode = false;
    const storeKey = () => (currentUser?.id ? `${BASE_STORE_KEY}-${currentUser.id}` : BASE_STORE_KEY);
    const universeId = () => (currentUser?.id ? currentUser.id : null);
    function isoOf(ms) { const d = new Date(ms); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
    const todayISO = () => isoOf(Date.now());
    const addDays = (n) => isoOf(Date.now() + n * DAY);
    const uid = (p) => `${p}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
    function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
    const isMobile = () => window.innerWidth < 768;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // =========================================================================
    // 1. Audio Engine (procedural, zero assets)
    // =========================================================================
    let audioCtx = null;
    function playTone(f, d = 0.16, g = 0.1, type = "sine") {
      if (!STATE.soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const o = audioCtx.createOscillator(), v = audioCtx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f, audioCtx.currentTime);
        v.gain.setValueAtTime(g, audioCtx.currentTime);
        v.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
        o.connect(v); v.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + d);
      } catch (e) {}
    }
    const sfx = {
      click: () => playTone(660, 0.06, 0.05, "triangle"),
      dive: () => { playTone(280, 0.18, 0.09); setTimeout(() => playTone(420, 0.22, 0.07), 55); },
      done: () => { playTone(523.25, 0.25); setTimeout(() => playTone(659.25, 0.3), 75); },
      undo: () => playTone(330, 0.12, 0.06),
      levelUp: () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => playTone(f, 0.35, 0.09), i * 90)),
      del: () => { playTone(300, 0.14); setTimeout(() => playTone(200, 0.18), 55); },
      add: () => playTone(440, 0.16),
    };

    // =========================================================================
    // 2. State + localStorage persistence (P0) + Recurring task helpers
    // =========================================================================
    const RECUR_LABEL = {
      daily: "↻ Daily",
      weekdays: "↻ Weekdays",
      weekly: "↻ Weekly",
      monthly: "↻ Monthly",
    };

    function nextRecurringDate(currentDueISO, recur) {
      const baseStr = currentDueISO && currentDueISO > todayISO() ? currentDueISO : todayISO();
      const [y, m, d] = baseStr.split("-").map(Number);
      const dt = new Date(y, m - 1, d, 12, 0, 0);
      if (recur === "daily") {
        dt.setDate(dt.getDate() + 1);
      } else if (recur === "weekdays") {
        do { dt.setDate(dt.getDate() + 1); } while (dt.getDay() === 0 || dt.getDay() === 6);
      } else if (recur === "weekly") {
        dt.setDate(dt.getDate() + 7);
      } else if (recur === "monthly") {
        dt.setMonth(dt.getMonth() + 1);
      } else {
        dt.setDate(dt.getDate() + 1);
      }
      return isoOf(dt.getTime());
    }

    function seedState() {
      const now = Date.now();
      const mk = (id, name, icon, color) => ({
        id, name, icon, color, parentId: null, childrenIds: [], xp: 0, tasks: [],
        strain: { fin: false, psy: false }, notes: [],
        timeline: [{ id: uid("e"), type: "created", text: "Planet charted", at: now }], createdAt: now,
      });
      const planets = {
        "planet-home": mk("planet-home", "Home", "🏠", "#4A6FA5"),
        "planet-business": mk("planet-business", "Business", "💼", "#6B4A8A"),
        "planet-social": mk("planet-social", "Social", "👥", "#2D7A8A"),
        "planet-hobbies": mk("planet-hobbies", "Hobbies", "🎨", "#3B7A57"),
      };
      return {
        version: 3,
        updatedAt: 0,
        _isDefaultSeed: true,
        planets,
        rootIds: ["planet-home", "planet-business", "planet-social", "planet-hobbies"],
        life: { name: "Life", icon: "☀️", color: "#0F766E", notes: [], timeline: [{ id: uid("e"), type: "created", text: "Life universe seeded", at: now }] },
        soundOn: true,
        focusId: null,
      };
    }
    function normalizeState(s) {
      if (!s || !s.planets || !Array.isArray(s.rootIds)) return null;
      // Upgrade legacy v1/v2 demo states (which had Deloitte/Cultivation) to the clean v3 4-planet seed if untouched
      if ((s.version || 1) < 3 && s.planets["planet-deloitte"] && s.planets["planet-cultivation"]) {
        return null;
      }
      Object.values(s.planets).forEach(p => {
        (p.tasks || []).forEach(t => {
          if (typeof t.recur !== "string") t.recur = "";
          if (typeof t.streak !== "number") t.streak = 0;
          if (!Array.isArray(t.history)) t.history = [];
        });
      });
      return s;
    }
    function loadState() {
      try {
        const raw = localStorage.getItem(storeKey());
        if (raw) {
          const s = normalizeState(JSON.parse(raw));
          if (s) return s;
        }
      } catch (e) {}
      return seedState();
    }
    let STATE = loadState();

    // Supabase Auth + Cloud Persistence Engine
    const SUPABASE_URL = "https://fzynqetgqohgeqsdnttm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_h5qp70G8q8wVfI9QrFa7mw_hiflEA4i";
    const SUPABASE_ANON_JWT = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6eW5xZXRncW9oZ2Vxc2RudHRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5MjA2ODIsImV4cCI6MjEwOTQ5NjY4Mn0.m_-NY6yhucEfWEOL_q5-fHzW4R1NHLZAbKsODxYzIrQ";
    const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_JWT) : null;
    let activeAccessToken = SUPABASE_KEY;
    let syncTimer = null;

    function setCloudStatus(text, tone = "ok") {
      const btns = [document.getElementById("btnCloudSync"), document.getElementById("mobBtnCloudSync")];
      btns.forEach(btn => {
        if (!btn) return;
        btn.textContent = text;
        btn.className = tone === "syncing"
          ? "px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-full text-xs sm:text-sm font-medium border border-amber-400/45 bg-amber-400/10 text-amber-200 transition-all cursor-pointer"
          : tone === "err"
          ? "px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-full text-xs sm:text-sm font-medium border border-red-400/45 bg-red-500/10 text-red-200 transition-all cursor-pointer"
          : "px-2.5 sm:px-3.5 py-1 sm:py-1.5 rounded-full text-xs sm:text-sm font-medium border border-teal-400/35 bg-teal-400/10 text-teal-200 hover:border-teal-400 transition-all cursor-pointer";
      });
    }

    function updateAuthUI() {
      const screen = document.getElementById("loginScreen");
      const btn = document.getElementById("btnAuthUser");
      const mobBtn = document.getElementById("mobBtnAuth");
      const authed = !!currentUser || guestMode;
      if (screen) {
        screen.classList.toggle("hidden", authed);
        screen.classList.toggle("flex", !authed);
      }
      const label = currentUser ? (currentUser.user_metadata?.full_name || currentUser.email?.split("@")[0] || "Account") : "Sign In";
      if (btn) {
        if (currentUser) {
          btn.textContent = `👤 ${label} · Sign Out`;
          btn.title = `Signed in as ${currentUser.email || label}. Click to sign out.`;
        } else {
          btn.textContent = "👤 Sign In";
          btn.title = "Open login screen";
        }
      }
      if (mobBtn) {
        mobBtn.textContent = currentUser ? `👤` : "👤 In";
        mobBtn.title = currentUser ? `Signed in as ${currentUser.email || label}. Click to manage.` : "Open login screen";
      }
    }

    function showAuthError(htmlMsg) {
      const box = document.getElementById("authErrorBox");
      if (!box) return;
      box.innerHTML = htmlMsg;
      box.classList.remove("hidden");
    }

    async function signInWithGoogle() {
      if (!sbClient) return;
      try {
        const redirectUrl = (window.top || window).location.origin;
        const { data, error } = await sbClient.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: redirectUrl,
            skipBrowserRedirect: true,
          },
        });
        if (error) throw error;
        if (data?.url) {
          (window.top || window).location.href = data.url;
        }
      } catch (err) {
        showAuthError(
          `<b>Google OAuth note:</b> ${esc(err.message || "Google provider not enabled yet")}.<br>` +
          `Enable Google under <a href="https://supabase.com/dashboard/project/fzynqetgqohgeqsdnttm/auth/providers" target="_blank" class="underline text-teal-300">Supabase Auth → Providers → Google</a>, or sign in with Email/Password below.`
        );
      }
    }

    async function signInWithEmail(isSignUp = false) {
      if (!sbClient) return;
      const email = document.getElementById("inputAuthEmail")?.value.trim();
      const password = document.getElementById("inputAuthPass")?.value || "";
      if (!email || password.length < 6) {
        showAuthError("Please enter a valid email address and a password (at least 6 characters).");
        return;
      }
      try {
        const res = isSignUp
          ? await sbClient.auth.signUp({ email, password })
          : await sbClient.auth.signInWithPassword({ email, password });
        if (res.error) throw res.error;
        if (res.data?.session) {
          toast(isSignUp ? "✦ Account created & signed in" : "✦ Signed in");
        } else if (isSignUp) {
          showAuthError("✦ Check your email inbox to confirm your account, or sign in directly if email confirmation is disabled.");
        }
      } catch (err) {
        showAuthError(esc(err.message || "Authentication failed."));
      }
    }

    async function signOutUser() {
      if (sbClient && currentUser) {
        await sbClient.auth.signOut();
      }
      currentUser = null;
      guestMode = false;
      activeAccessToken = SUPABASE_KEY;
      updateAuthUI();
    }

    async function saveToSupabase() {
      if (!currentUser || !currentUser.id) {
        setCloudStatus("💾 Local only", "ok");
        return;
      }
      setCloudStatus("⟳ Syncing…", "syncing");
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/sync_universe_state`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${activeAccessToken || SUPABASE_KEY}`,
          },
          body: JSON.stringify({ p_universe_id: universeId(), p_state: STATE }),
        });
        if (!res.ok) throw new Error("RPC failed");
        setCloudStatus("☁️ Synced", "ok");
      } catch (e) {
        setCloudStatus("☁️ Offline mode", "err");
      }
    }
    async function loadFromSupabase() {
      if (!currentUser || !currentUser.id) {
        setCloudStatus("💾 Local only", "ok");
        return;
      }
      setCloudStatus("⟳ Loading…", "syncing");
      try {
        const uidParam = encodeURIComponent(universeId());
        const res = await fetch(`${SUPABASE_URL}/rest/v1/universe_states?id=eq.${uidParam}&select=id,state,updated_at`, {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: `Bearer ${activeAccessToken || SUPABASE_KEY}`,
          },
          cache: "no-store",
        });
        if (!res.ok) throw new Error("Fetch failed");
        const rows = await res.json();
        const remote = Array.isArray(rows) && rows[0]?.state ? normalizeState(rows[0].state) : null;
        if (remote) {
          const remoteTs = remote.updatedAt || new Date(rows[0].updated_at || 0).getTime() || 0;
          const localTs = STATE.updatedAt || 0;
          const hasLocalCustomData = !STATE._isDefaultSeed && !!localStorage.getItem(storeKey());
          // Always adopt remote unless local has explicit user modifications newer than remote
          if (!hasLocalCustomData || remoteTs >= localTs) {
            STATE = remote;
            STATE._isDefaultSeed = false;
            focusId = STATE.focusId && STATE.planets[STATE.focusId] ? STATE.focusId : null;
            try { localStorage.setItem(storeKey(), JSON.stringify(STATE)); } catch (err) {}
            healthCache.clear();
            render();
          } else {
            await saveToSupabase();
          }
          setCloudStatus("☁️ Synced", "ok");
        } else {
          // No remote state yet for this user: check if there's any local storage data to migrate
          let fallbackState = null;
          try {
            const userRaw = localStorage.getItem(storeKey());
            const defaultRaw = localStorage.getItem(BASE_STORE_KEY);
            const parsed = userRaw ? JSON.parse(userRaw) : (defaultRaw ? JSON.parse(defaultRaw) : null);
            if (parsed && !parsed._isDefaultSeed) fallbackState = normalizeState(parsed);
          } catch (e) {}

          STATE = fallbackState || seedState();
          STATE._isDefaultSeed = false;
          STATE.updatedAt = Date.now();
          focusId = null; selectedId = null;
          render();
          await saveToSupabase();
          setCloudStatus("☁️ Synced", "ok");
        }
      } catch (e) {
        setCloudStatus("☁️ Offline mode", "err");
      }
    }

    function save() {
      STATE._isDefaultSeed = false;
      STATE.updatedAt = Date.now();
      try { localStorage.setItem(storeKey(), JSON.stringify(STATE)); } catch (e) {}
      if (currentUser) {
        clearTimeout(syncTimer);
        syncTimer = setTimeout(() => { saveToSupabase(); }, 300);
      } else {
        setCloudStatus("💾 Local only", "ok");
      }
    }

    // UI-only state
    let focusId = STATE.focusId && STATE.planets[STATE.focusId] ? STATE.focusId : null;
    let selectedId = null;            // inspected orbiting planet (P1: inspect vs dive)
    let hudTab = "missions";          // missions | notes | timeline
    let showCompleted = false;
    let mobView = "orbit";              // orbit | missions | checkin | account
    let orbitOffset = 0, orbitPaused = false, hoveringNode = false;

    // =========================================================================
    // 3. Tree helpers
    // =========================================================================
    const P = (id) => (id ? STATE.planets[id] : null);
    const childIds = (id) => (id ? (P(id)?.childrenIds || []) : STATE.rootIds).filter(cid => P(cid));
    function descendants(id) {
      const out = [];
      const walk = (ids) => ids.forEach(cid => { const p = P(cid); if (!p) return; out.push(cid); walk(p.childrenIds); });
      walk(childIds(id));
      return out;
    }
    function ancestorsChain(pid) { const out = []; let c = P(pid); while (c) { out.push(c); c = P(c.parentId); } return out; }
    const lifeNode = () => ({
      id: null,
      name: STATE.life?.name || "Life",
      icon: STATE.life?.icon || "☀️",
      color: STATE.life?.color || "#0F766E",
      childrenIds: STATE.rootIds,
      tasks: [],
      strain: { fin: false, psy: false },
    });
    const ownerOf = (id) => (id ? P(id) : STATE.life);

    // =========================================================================
    // 4. Mechanics (P1): task-driven health, strain as "gravity", monotonic subtree XP
    // =========================================================================
    function taskStats(p) {
      const today = todayISO(); let overdue = 0, recent = 0, doneToday = 0, open = 0;
      for (const t of p.tasks) {
        if (Array.isArray(t.history)) {
          for (const h of t.history) {
            if (h.at && Date.now() - h.at < 7 * DAY) recent++;
            if (h.at && isoOf(h.at) === today) doneToday++;
          }
        }
        if (t.done) {
          if (t.doneAt && Date.now() - t.doneAt < 7 * DAY) recent++;
          if (t.doneAt && isoOf(t.doneAt) === today) doneToday++;
        } else {
          open++;
          if (t.due && t.due < today) overdue++;
        }
      }
      return { overdue, recent, doneToday, open };
    }
    const strainCount = (p) => (p?.strain?.fin ? 1 : 0) + (p?.strain?.psy ? 1 : 0);
    // Each strain flag applies -15 pressure; every task completed TODAY neutralises 10 of it.
    const strainPenalty = (p, st) => Math.max(0, 15 * strainCount(p) - 10 * st.doneToday);

    const healthCache = new Map();
    // H = base(85 for leaves | avg(children) for parents) + 5·min(3, done last 7d) − 15·overdue − net strain
    function computeHealth(p) {
      if (!p) {
        const ids = childIds(null);
        if (!ids.length) return 85;
        return Math.round(ids.reduce((a, id) => a + computeHealth(P(id)), 0) / ids.length);
      }
      if (healthCache.has(p.id)) return healthCache.get(p.id);
      const st = taskStats(p);
      const kids = childIds(p.id);
      const base = kids.length ? kids.reduce((a, id) => a + computeHealth(P(id)), 0) / kids.length : 85;
      const s = Math.round(clamp(base + 5 * Math.min(3, st.recent) - 15 * st.overdue - strainPenalty(p, st), 0, 100));
      healthCache.set(p.id, s);
      return s;
    }
    const healthHex = (s) => (s >= 70 ? "#2DD4BF" : s >= 45 ? "#F59E0B" : "#EF4444");

    // XP = diff² × 5 × (1 + 0.25 × active strains)  → 5 / 20 / 45 / 80 / 125 XP
    const taskXP = (diff, strains) => Math.round(diff * diff * 5 * (1 + 0.25 * strains));
    // Parent XP = own XP + all descendant XP → adding an empty planet can never lower a level.
    const subtreeXP = (p) => (p.xp || 0) + descendants(p.id).reduce((a, id) => a + (P(id).xp || 0), 0);
    const universeXP = () => descendants(null).reduce((a, id) => a + (P(id).xp || 0), 0);
    const levelFromXP = (xp) => 1 + Math.floor(10 * Math.pow(Math.max(0, xp) / 100, 0.75)) / 10;
    const xpForLevel = (L) => 100 * Math.pow(Math.max(0, L - 1), 4 / 3);
    function levelInfo(xp) {
      const lvl = levelFromXP(xp), whole = Math.floor(lvl);
      const a = xpForLevel(whole), b = xpForLevel(whole + 1);
      return { lvl, whole, pct: clamp(((xp - a) / (b - a)) * 100, 0, 100), toNext: Math.max(0, Math.ceil(b - xp)), xp };
    }
    const xpOf = (p) => (p && p.id ? subtreeXP(p) : universeXP());
    const levelOf = (p) => levelFromXP(xpOf(p));

    function logEvent(pid, type, text) {
      const owner = ownerOf(pid); if (!owner) return;
      owner.timeline = owner.timeline || [];
      owner.timeline.unshift({ id: uid("e"), type, text, at: Date.now() });
      if (owner.timeline.length > 120) owner.timeline.length = 120;
    }

    // =========================================================================
    // 5. Mutations
    // =========================================================================
    function commit() { STATE.focusId = focusId; healthCache.clear(); save(); render(); }

    function dive(id) {
      if (id && !P(id)) id = null;
      sfx.dive();
      focusId = id; selectedId = null; showCompleted = false; hoveringNode = false;
      commit();
    }
    function select(id) {
      if (id === selectedId) return;
      sfx.click();
      selectedId = id;
      updateSelectionVisuals();
      renderHUD();
      renderMobile();
    }

    function toggleTask(pid, tid) {
      const p = P(pid); const t = p?.tasks.find(x => x.id === tid); if (!t) return;
      const chain = ancestorsChain(pid);
      const before = chain.map(c => Math.floor(levelOf(c)));
      const uBefore = Math.floor(levelFromXP(universeXP()));

      if (t.recur) {
        // Recurring task: award XP, increment streak, log cycle, and advance due date
        const strains = strainCount(p);
        const gain = taskXP(t.diff, strains);
        t.history = Array.isArray(t.history) ? t.history : [];
        const prevDue = t.due || todayISO();
        t.due = nextRecurringDate(t.due, t.recur);
        t.streak = (t.streak || 0) + 1;
        t.history.unshift({ at: Date.now(), xp: gain, prevDue });
        if (t.history.length > 60) t.history.length = 60;
        p.xp = (p.xp || 0) + gain;
        logEvent(pid, "done", `Cycled ${RECUR_LABEL[t.recur] || "↻"} “${t.title}” (🔥 ${t.streak}) · +${gain} XP`);
        sfx.done();
        const ups = chain.filter((c, i) => Math.floor(levelOf(c)) > before[i]);
        const uUp = Math.floor(levelFromXP(universeXP())) > uBefore;
        if (ups.length || uUp) {
          ups.forEach(c => logEvent(c.id, "levelup", `Reached Level ${Math.floor(levelOf(c))}`));
          if (uUp) logEvent(null, "levelup", `Life reached Level ${Math.floor(levelFromXP(universeXP()))}`);
          setTimeout(sfx.levelUp, 260);
          toast(`⬆ ${ups[0] ? ups[0].name : "Life"} reached Level ${Math.floor(ups[0] ? levelOf(ups[0]) : levelFromXP(universeXP()))}!`, "#E5A93C");
        } else {
          toast(`↻ +${gain} XP · 🔥 ${t.streak} streak · next due ${t.due}`);
        }
        commit();
        pulse(pid);
        return;
      }

      if (!t.done) {
        const strains = strainCount(p);
        const gain = taskXP(t.diff, strains);
        t.done = true; t.doneAt = Date.now(); t.xpAwarded = gain;
        p.xp = (p.xp || 0) + gain;
        logEvent(pid, "done", `Completed “${t.title}” · +${gain} XP`);
        sfx.done();
        const ups = chain.filter((c, i) => Math.floor(levelOf(c)) > before[i]);
        const uUp = Math.floor(levelFromXP(universeXP())) > uBefore;
        if (ups.length || uUp) {
          ups.forEach(c => logEvent(c.id, "levelup", `Reached Level ${Math.floor(levelOf(c))}`));
          if (uUp) logEvent(null, "levelup", `Life reached Level ${Math.floor(levelFromXP(universeXP()))}`);
          setTimeout(sfx.levelUp, 260);
          toast(`⬆ ${ups[0] ? ups[0].name : "Life"} reached Level ${Math.floor(ups[0] ? levelOf(ups[0]) : levelFromXP(universeXP()))}!`, "#E5A93C");
        } else {
          toast(`+${gain} XP · ${p.name}${strains ? " · resilience bonus" : ""}`);
        }
      } else {
        p.xp = Math.max(0, (p.xp || 0) - (t.xpAwarded || 0));
        t.done = false; t.doneAt = null; t.xpAwarded = 0;
        logEvent(pid, "undo", `Reopened “${t.title}”`);
        sfx.undo();
      }
      commit();
      pulse(pid);
    }

    function undoRecurringCycle(pid, tid) {
      const p = P(pid); const t = p?.tasks.find(x => x.id === tid);
      if (!t || !Array.isArray(t.history) || !t.history.length) return;
      const last = t.history.shift();
      p.xp = Math.max(0, (p.xp || 0) - (last.xp || 0));
      t.streak = Math.max(0, (t.streak || 1) - 1);
      if (last.prevDue) t.due = last.prevDue;
      logEvent(pid, "undo", `Undid cycle on “${t.title}”`);
      sfx.undo();
      commit();
    }

    function deleteTask(pid, tid) {
      const p = P(pid); if (!p) return;
      const t = p.tasks.find(x => x.id === tid); if (!t) return;
      p.tasks = p.tasks.filter(x => x.id !== tid);
      logEvent(pid, "deleted", `Removed task “${t.title}”`);
      sfx.del();
      commit();
    }

    function deletePlanet(id) {
      const target = P(id); if (!target) return;
      const sub = descendants(id).length;
      const msg = `Delete “${target.name}”${sub ? ` and its ${sub} satellite${sub > 1 ? "s" : ""}` : ""}? All tasks and notes inside will be lost.`;
      if (!window.confirm(msg)) return;
      const parentId = target.parentId;
      if (parentId && P(parentId)) P(parentId).childrenIds = P(parentId).childrenIds.filter(c => c !== id);
      else STATE.rootIds = STATE.rootIds.filter(r => r !== id);
      [id, ...descendants(id)].forEach(did => delete STATE.planets[did]);
      logEvent(parentId, "deleted", `Planet “${target.name}” removed from orbit`);
      if (!P(focusId)) focusId = parentId && P(parentId) ? parentId : null;
      if (!P(selectedId)) selectedId = null;
      sfx.del();
      toast(`“${target.name}” removed`, "#EF4444");
      commit();
    }

    function toggleStrain(id, kind) {
      const p = P(id); if (!p) return;
      p.strain[kind] = !p.strain[kind];
      const label = kind === "fin" ? "Financial strain" : "Psychological strain";
      logEvent(id, "strain", `${label} ${p.strain[kind] ? "flagged" : "cleared"}`);
      if (p.strain[kind]) toast(`High gravity on ${p.name} · tasks here earn bonus XP`, "#F59E0B");
      sfx.click();
      commit();
    }

    function addNote(id, text) {
      const owner = ownerOf(id); if (!owner || !text.trim()) return;
      owner.notes = owner.notes || [];
      owner.notes.unshift({ id: uid("n"), text: text.trim(), at: Date.now() });
      logEvent(id, "note", "Note added");
      sfx.add();
      commit();
    }
    function deleteNote(id, nid) {
      const owner = ownerOf(id); if (!owner) return;
      owner.notes = (owner.notes || []).filter(n => n.id !== nid);
      commit();
    }

    function renderNodeIcon(iconStr, pxSize = 20) {
      const k = (iconStr || "").trim();
      const paths = LUCIDE_MAP[k] || LUCIDE_MAP[k.replace(/\uFE0F/g, "")];
      if (paths) {
        return `<svg width="${pxSize}" height="${pxSize}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="inline-block shrink-0 pointer-events-none" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,0.45))">${paths}</svg>`;
      }
      return `<span class="inline-flex items-center justify-center leading-none" style="font-size:${Math.round(pxSize * 0.9)}px;filter:none">${esc(iconStr || "✦")}</span>`;
    }

    const svgEl = document.getElementById("orbitalArcSvg");

    let mobSheetSnap = "peek"; // "peek" | "expanded"

    function geom() {
      const w = window.innerWidth, h = window.innerHeight;
      const mob = isMobile();
      if (mob) {
        const topSafe = 62;
        const sheetEl = document.getElementById("mobOrbitSheet");
        const sheetTop = sheetEl ? sheetEl.getBoundingClientRect().top : (mobSheetSnap === "peek" ? h - 180 : h - 385);
        const availH = Math.max(220, sheetTop - topSafe - 14);
        const cx = Math.round(w / 2);
        const cy = Math.round(topSafe + availH * 0.45);
        const radius = Math.round(clamp(Math.min(w * 0.39, availH * 0.44), 104, 150));
        const ry = Math.round(radius * 0.88);
        const scale = clamp(Math.min(w / 410, availH / 340), 0.68, 0.88);
        return { w, h, cx, cy, radius, ry, scale };
      }
      const panel = w >= 1536 ? 545 : w >= 1280 ? 495 : 425;
      const cx = Math.round((w - panel) / 2 - 16);
      const cy = Math.round(h / 2 + 16);
      const radius = Math.round(clamp(Math.min(w - panel - 90, h - 175) * 0.4, 175, 450));
      const scale = clamp(Math.min(w / 1400, h / 880), 0.9, 1.35);
      return { w, h, cx, cy, radius, ry: radius, scale };
    }

    function createNode(pl, size, kind) {
      const isFocus = kind === "focus", isParent = kind === "wayback";
      const score = computeHealth(pl.id ? pl : null), hex = healthHex(score);
      const lvl = levelOf(pl.id ? pl : null);
      const kids = childIds(pl.id);
      const hasMoons = kind === "child" && kids.length > 0;
      const pad = isFocus ? 18 : hasMoons ? 24 : 14;
      const r = size / 2 + (isFocus ? 9 : 7);
      const circ = 2 * Math.PI * r, filled = (score / 100) * circ;
      const svgDim = size + pad * 2, c = svgDim / 2, sw = isFocus ? 3.5 : 2.75;
      const strained = pl.id && strainCount(pl) > 0;
      const mob = isMobile();
      const titlePx = Math.round(size * (mob ? (isFocus ? 0.20 : 0.22) : (isFocus ? 0.22 : isParent ? 0.25 : 0.235)));
      const pillPx = mob ? 11 : (isFocus ? 14 : 13);
      const labelMarginTop = Math.max(11, pad + (hasMoons ? 4 : -1)) + (kind === "child" ? 10 : 0);
      const maxLabelW = mob ? (isFocus ? 150 : 116) : (isFocus ? 210 : 165);
      const iconPx = Math.round(size * 0.45);

      const moons = hasMoons ? kids.slice(0, 10).map((cid, i, arr) => {
        const a = ((-90 + i * (360 / arr.length)) * Math.PI) / 180;
        const mh = healthHex(computeHealth(P(cid)));
        return `<circle cx="${c + Math.cos(a) * (r + 11)}" cy="${c + Math.sin(a) * (r + 11)}" r="4" fill="${mh}" style="filter:drop-shadow(0 0 5px ${mh})"><title>${esc(P(cid).name)}</title></circle>`;
      }).join("") : "";

      const wrapper = document.createElement("div");
      wrapper.className = "absolute left-0 top-0 pointer-events-auto cursor-pointer will-change-transform";
      if (isFocus) wrapper.style.zIndex = "3";
      wrapper.innerHTML = `
        <div class="node-inner relative flex items-center justify-center transition-transform duration-200 ${isFocus ? "hover:scale-[1.03] pill-always" : "hover:scale-110"} ${isParent ? "pill-always" : ""}" style="width:${size}px;height:${size}px;">
          <div class="absolute rounded-full pointer-events-none" style="width:${size * 1.85}px;height:${size * 1.85}px;top:${-size * 0.425}px;left:${-size * 0.425}px;background:radial-gradient(circle, ${pl.color}55 0%, transparent 70%);"></div>
          ${kind === "child" ? `<div class="reticle-wrap absolute pointer-events-none" style="inset:${-pad - 4}px;display:none"><div class="reticle w-full h-full rounded-full border border-dashed border-amber-300/60"></div></div>` : ""}
          <svg class="absolute pointer-events-none overflow-visible" width="${svgDim}" height="${svgDim}" style="top:${-pad}px;left:${-pad}px;">
            ${isFocus ? `<circle cx="${c}" cy="${c}" r="${r + 8}" fill="none" stroke="rgba(45,212,191,0.18)" stroke-dasharray="3 7"/>` : ""}
            <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="${sw}"/>
            <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${hex}" stroke-width="${sw}"
                    stroke-dasharray="${filled} ${circ - filled}" stroke-dashoffset="${circ / 4}" stroke-linecap="round"
                    style="filter:drop-shadow(0 0 6px ${hex}88)"/>
            ${strained ? `<circle class="strain-pulse" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#EF4444" stroke-width="${sw + 0.8}" stroke-dasharray="${circ * 0.12 * strainCount(pl)} ${circ}" stroke-dashoffset="${-circ * 0.1}" stroke-linecap="round" style="filter:drop-shadow(0 0 8px #EF4444)"/>` : ""}
            ${moons}
          </svg>
          <div class="planet-disc w-full h-full rounded-full inline-flex items-center justify-center leading-none select-none text-white"
               style="color:#F8FAFC;background:radial-gradient(circle at 32% 28%, ${pl.color}ee, ${pl.color} 70%, #0D0F0E 140%);box-shadow:0 0 24px ${pl.color}66, inset 0 2px 4px rgba(255,255,255,0.25), inset 0 -3px 6px rgba(0,0,0,0.4);">
            ${renderNodeIcon(pl.icon, iconPx)}
          </div>
          <div class="node-label absolute top-full flex flex-col items-center pointer-events-none left-1/2 -translate-x-1/2 whitespace-nowrap z-30" style="margin-top:${labelMarginTop}px">
            <span class="font-fraunces text-white truncate leading-snug px-2 py-0.5 rounded-md bg-[#0D0F0E]/75 backdrop-blur-[2px] tracking-wide" style="max-width:${maxLabelW}px;font-size:${titlePx}px;font-weight:${isFocus ? 600 : 500};text-shadow:0 2px 12px #000, 0 0 4px #000;">
              ${isParent ? "← " : ""}${esc(pl.name)}
            </span>
            <div class="node-pill mt-0.5 flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#0B0E0F]/95 border border-white/15 font-medium shadow-[0_4px_14px_rgba(0,0,0,0.65)]" style="font-size:${pillPx}px">
              <span class="font-semibold" style="color:${hex}">${score}%</span>
              <span class="text-slate-400">·</span>
              <span class="text-amber-300 font-semibold">Lv ${Math.floor(lvl)}</span>
              ${kids.length && !isFocus ? `<span class="text-slate-400">·</span><span class="text-teal-300">${kids.length} in orbit</span>` : ""}
            </div>
          </div>
        </div>`;
      wrapper.addEventListener("mouseenter", () => { hoveringNode = true; });
      wrapper.addEventListener("mouseleave", () => { hoveringNode = false; });
      wrapper.addEventListener("touchstart", () => { hoveringNode = true; lastTouchTime = Date.now(); }, { passive: true });
      wrapper.addEventListener("touchend", () => { setTimeout(() => { hoveringNode = false; }, 2000); }, { passive: true });
      return wrapper;
    }

    function rebuildScene() {
      domContainer.innerHTML = "";
      svgEl.innerHTML = "";
      scene = { focusEl: null, wbEl: null, kidEls: {}, kids: [], orbit: null, wbPath: null, arcs: [] };
      if (isMobile() && mobView !== "orbit") {
        svgEl.style.display = "none";
        domContainer.style.display = "none";
        return;
      }
      svgEl.style.display = "block";
      domContainer.style.display = "block";
      const g = geom();
      const fp = P(focusId);
      const kids = childIds(focusId);
      scene.kids = kids;
      const s = g.scale;
      const mob = isMobile();

      // SVG skeleton, created once per scene and mutated per frame
      const orbit = document.createElementNS(SVGNS, "ellipse");
      orbit.setAttribute("fill", "none"); orbit.setAttribute("stroke", "rgba(45,212,191,0.14)"); orbit.setAttribute("stroke-width", "1.25");
      svgEl.appendChild(orbit); scene.orbit = orbit;
      if (fp) {
        const wp = document.createElementNS(SVGNS, "path");
        wp.setAttribute("fill", "none"); wp.setAttribute("stroke", "rgba(234,179,8,0.22)"); wp.setAttribute("stroke-width", "1.5");
        wp.setAttribute("class", "arc-animated");
        svgEl.appendChild(wp); scene.wbPath = wp;
      }
      kids.forEach((cid, i) => {
        const a = document.createElementNS(SVGNS, "path");
        a.setAttribute("fill", "none");
        a.setAttribute("stroke", i % 2 === 0 ? "rgba(45,212,191,0.20)" : "rgba(234,179,8,0.16)");
        a.setAttribute("stroke-width", "1.5");
        a.setAttribute("class", "arc-animated");
        svgEl.appendChild(a); scene.arcs.push(a);
      });

      // Wayback parent
      if (fp) {
        const par = P(fp.parentId) || lifeNode();
        const el = createNode(par, Math.round((mob ? 50 : 64) * s), "wayback");
        el.addEventListener("click", (e) => { e.stopPropagation(); dive(fp.parentId || null); });
        domContainer.appendChild(el); scene.wbEl = el;
      }
      // Focus centre
      const focusSize = mob ? clamp(Math.round(g.radius * 0.56), 58, 72) : Math.round(114 * s);
      const center = createNode(fp || lifeNode(), focusSize, "focus");
      center.addEventListener("click", (e) => { e.stopPropagation(); select(null); });
      domContainer.appendChild(center); scene.focusEl = center;

      // Orbiting children: click = inspect, click again = dive
      const childSize = mob ? clamp(Math.round(g.radius * 0.40), 42, 52) : Math.round(78 * s);
      kids.forEach(cid => {
        const el = createNode(P(cid), childSize, "child");
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          if (selectedId === cid) dive(cid); else select(cid);
        });
        domContainer.appendChild(el); scene.kidEls[cid] = el;
      });

      if (!kids.length) {
        const hint = document.createElement("div");
        hint.className = "absolute left-0 top-0 pointer-events-auto";
        hint.dataset.role = "empty-hint";
        hint.innerHTML = `<button data-act="add-sat" data-id="${focusId || ""}" class="px-4 py-2.5 rounded-full border border-dashed border-amber-400/50 bg-[#0B0E0F] text-amber-300 text-sm hover:border-amber-300 cursor-pointer">✨ No satellites yet · launch the first one</button>`;
        domContainer.appendChild(hint); scene.hintEl = hint;
      }
      hoveringNode = false;
      updateSelectionVisuals();
      updateOrbitalPositions();
    }

    function place(el, x, y) { el.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%)`; }

    function updateOrbitalPositions() {
      if (!scene.orbit) return;
      const { cx, cy, radius, ry } = geom();
      const mob = isMobile();
      if (scene.focusEl) place(scene.focusEl, cx, cy);
      scene.orbit.setAttribute("cx", cx); scene.orbit.setAttribute("cy", cy);
      scene.orbit.setAttribute("rx", radius); scene.orbit.setAttribute("ry", ry);
      if (scene.hintEl) place(scene.hintEl, cx, cy + ry * 0.75);

      const wbX = mob ? Math.max(46, Math.round(cx - radius * 0.94)) : Math.max(95, Math.round(cx - radius * 1.15));
      const wbY = mob ? Math.max(88, Math.round(cy - ry * 0.92)) : Math.max(125, Math.round(cy - ry * 0.82));
      if (scene.wbEl) place(scene.wbEl, wbX, wbY);
      if (scene.wbPath) scene.wbPath.setAttribute("d", `M ${wbX} ${wbY} Q ${cx - radius * (mob ? 0.55 : 0.7)} ${wbY + (cy - wbY) * 0.65} ${cx} ${cy}`);

      const n = scene.kids.length;
      for (let i = 0; i < n; i++) {
        const angle = -90 + (360 / n) * i + orbitOffset;
        const rad = (angle * Math.PI) / 180;
        const ex = cx + Math.cos(rad) * radius, ey = cy + Math.sin(rad) * ry;
        const el = scene.kidEls[scene.kids[i]];
        if (el) place(el, ex, ey);
        const mx = (cx + ex) / 2, my = (cy + ey) / 2;
        const pRad = ((angle + 90) * Math.PI) / 180;
        const cpx = mx + Math.cos(pRad) * (radius * 0.34), cpy = my + Math.sin(pRad) * (ry * 0.34);
        scene.arcs[i].setAttribute("d", `M ${cx} ${cy} Q ${cpx} ${cpy} ${ex} ${ey}`);
      }
    }

    function dueLabel(t) {
      if (t.done) return t.doneAt ? `<span class="text-slate-400">Done ${isoOf(t.doneAt) === todayISO() ? "today" : isoOf(t.doneAt)}</span>` : "";
      if (!t.due) return `<span class="text-slate-400">No date</span>`;
      const diff = Math.round((new Date(t.due) - new Date(todayISO())) / DAY);
      if (diff < 0) return `<span class="text-red-300 font-semibold">Overdue ${-diff}d</span>`;
      if (diff === 0) return `<span class="text-amber-300 font-semibold">Today</span>`;
      if (diff === 1) return `<span class="text-slate-200">Tomorrow</span>`;
      return `<span class="text-slate-300">in ${diff}d</span>`;
    }

    function taskGroups(tid) {
      const today = todayISO(), items = [];
      if (tid) P(tid).tasks.forEach(t => items.push({ t, p: P(tid), scope: "here" }));
      descendants(tid).forEach(id => P(id).tasks.forEach(t => items.push({ t, p: P(id), scope: "orbit" })));
      const byDue = (a, b) => (a.t.due || "9999").localeCompare(b.t.due || "9999");
      const isOver = (x) => x.t.due && x.t.due < today;
      const open = items.filter(x => !x.t.done);
      return {
        overdue: open.filter(isOver).sort(byDue),
        here: open.filter(x => x.scope === "here" && !isOver(x)).sort(byDue),
        orbit: open.filter(x => x.scope === "orbit" && !isOver(x)).sort(byDue),
        done: items.filter(x => x.t.done).sort((a, b) => (b.t.doneAt || 0) - (a.t.doneAt || 0)),
        openCount: open.length, overdueCount: open.filter(isOver).length,
        hereCount: open.filter(x => x.scope === "here").length, orbitCount: open.filter(x => x.scope === "orbit").length,
      };
    }
