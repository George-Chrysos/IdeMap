    const FORGE_ICONS = ["✨", "🌱", "🏠", "💼", "📡", "🎮", "❤️", "👥", "🏋️", "📖", "💰", "🧘", "🎨", "✈️", "🧠", "🎵", "☀️", "🪐", "⚡", "🔬", "🍳", "🏔️", "🛠️", "🎯"];
    const FORGE_COLORS = ["#0F766E", "#3B7A57", "#4A6FA5", "#6B4A8A", "#2D7A8A", "#8A6B2D", "#8A2D5A", "#C04A4A", "#7A853B", "#2D5A8A", "#B45309", "#4F46E5"];
    let forge = { parentId: null, editId: undefined, icon: "✨", color: "#3B7A57" };
    function openModal(id) { const m = document.getElementById(id); m.classList.remove("hidden"); m.classList.add("flex"); }
    function closeModal(id) { const m = document.getElementById(id); m.classList.add("hidden"); m.classList.remove("flex"); }
    function renderForgePickers() {
      document.getElementById("forgeIcons").innerHTML = FORGE_ICONS.map(i => `<button data-act="forge-icon" data-v="${i}" class="w-9 h-9 rounded-lg text-lg inline-flex items-center justify-center cursor-pointer border ${forge.icon === i ? "border-teal-400 bg-teal-400/15 text-teal-200" : "border-white/10 bg-white/5 hover:border-white/30 text-slate-200"}">${renderNodeIcon(i, 18)}</button>`).join("");
      document.getElementById("forgeColors").innerHTML = FORGE_COLORS.map(c => `<button data-act="forge-color" data-v="${c}" class="w-8 h-8 rounded-full cursor-pointer ${forge.color.toLowerCase() === c.toLowerCase() ? "ring-2 ring-offset-2 ring-offset-[#0F1315] ring-teal-300" : ""}" style="background:${c}"></button>`).join("");
      const customIconEl = document.getElementById("inputForgeCustomIcon");
      if (customIconEl && document.activeElement !== customIconEl) customIconEl.value = forge.icon;
      const customColorEl = document.getElementById("inputForgeCustomColor");
      if (customColorEl) customColorEl.value = /^#[0-9a-fA-F]{6}$/.test(forge.color) ? forge.color : "#3B7A57";
    }
    function openForge(parentId) {
      forge = { parentId, editId: undefined, icon: "✨", color: FORGE_COLORS[Math.floor(Math.random() * FORGE_COLORS.length)] };
      document.getElementById("forgeTargetLabel").textContent = `Orbiting ${parentId ? P(parentId).name : (STATE.life?.name || "Life")}`;
      document.getElementById("forgeModalTitle").textContent = "Launch Celestial Node";
      document.getElementById("btnForgeConfirm").textContent = "Launch into Orbit";
      document.getElementById("btnForgeDelete")?.classList.add("hidden");
      document.getElementById("inputForgeName").value = "";
      renderForgePickers();
      openModal("forgeModal");
      setTimeout(() => document.getElementById("inputForgeName").focus(), 30);
    }
    function openEditPlanet(id) {
      const target = id ? P(id) : lifeNode();
      if (!target) return;
      forge = {
        parentId: target.parentId || null,
        editId: id || null, // null means editing root Life core
        icon: target.icon || "✨",
        color: target.color || "#3B7A57",
      };
      const parentName = id ? (P(target.parentId)?.name || STATE.life?.name || "Life") : "Solar System Core";
      document.getElementById("forgeTargetLabel").textContent = id ? `Orbiting ${parentName}` : parentName;
      document.getElementById("forgeModalTitle").textContent = "Customize Planet";
      document.getElementById("btnForgeConfirm").textContent = "Save Changes";
      const delBtn = document.getElementById("btnForgeDelete");
      if (delBtn) {
        if (id) {
          delBtn.dataset.id = id;
          delBtn.classList.remove("hidden");
        } else {
          delBtn.classList.add("hidden");
        }
      }
      document.getElementById("inputForgeName").value = target.name || "";
      renderForgePickers();
      openModal("forgeModal");
      setTimeout(() => document.getElementById("inputForgeName").focus(), 30);
    }
    function confirmForge() {
      const name = document.getElementById("inputForgeName").value.trim();
      if (!name) { document.getElementById("inputForgeName").focus(); return; }
      const customIconVal = document.getElementById("inputForgeCustomIcon")?.value.trim();
      const finalIcon = customIconVal || forge.icon || "✨";
      const finalColor = forge.color || "#3B7A57";

      if (forge.editId !== undefined) {
        if (forge.editId === null) {
          STATE.life = STATE.life || { notes: [], timeline: [] };
          STATE.life.name = name;
          STATE.life.icon = finalIcon;
          STATE.life.color = finalColor;
          logEvent(null, "renamed", `Customized core to ${finalIcon} “${name}”`);
        } else {
          const pl = P(forge.editId);
          if (pl) {
            pl.name = name;
            pl.icon = finalIcon;
            pl.color = finalColor;
            logEvent(pl.id, "renamed", `Customized planet to ${finalIcon} “${name}”`);
          }
        }
        closeModal("forgeModal");
        sfx.add();
        toast(`✦ Updated ${finalIcon} ${name}`);
        commit();
        return;
      }

      const id = uid("planet"), parentId = forge.parentId && P(forge.parentId) ? forge.parentId : null;
      STATE.planets[id] = { id, name, icon: finalIcon, color: finalColor, parentId, childrenIds: [], xp: 0, tasks: [], strain: { fin: false, psy: false }, notes: [], timeline: [{ id: uid("e"), type: "created", text: "Planet charted", at: Date.now() }], createdAt: Date.now() };
      if (parentId) P(parentId).childrenIds.push(id); else STATE.rootIds.push(id);
      logEvent(parentId, "added", `Satellite “${name}” launched into orbit`);
      closeModal("forgeModal");
      sfx.add();
      toast(`🚀 ${name} launched into orbit`);
      commit();
    }

    let editingTask = null; // { pid, tid } | null
    function openTaskModal(defaultPid, edit = null) {
      editingTask = edit;
      const sel = document.getElementById("selectTaskPlanet");
      const order = descendants(null);
      if (!order.length) { toast("Create a planet first", "#F59E0B"); openForge(null); return; }
      sel.innerHTML = order.map(pid => {
        const depth = ancestorsChain(pid).length - 1;
        return `<option value="${pid}">${"\u00A0\u00A0".repeat(depth)}${esc(P(pid).icon)} ${esc(P(pid).name)}</option>`;
      }).join("");
      const title = document.getElementById("inputTaskTitle"),
            diff = document.getElementById("selectTaskDiff"),
            due = document.getElementById("inputTaskDue"),
            recur = document.getElementById("selectTaskRecur");
      if (edit) {
        const t = P(edit.pid).tasks.find(x => x.id === edit.tid);
        document.getElementById("taskModalTitle").textContent = "Edit Task";
        document.getElementById("btnConfirmTask").textContent = "Save changes";
        title.value = t.title; sel.value = edit.pid; diff.value = String(t.diff); due.value = t.due || ""; recur.value = t.recur || "";
      } else {
        document.getElementById("taskModalTitle").textContent = "Add Task";
        document.getElementById("btnConfirmTask").textContent = "Add task";
        title.value = ""; diff.value = "2"; due.value = todayISO(); recur.value = "";
        sel.value = defaultPid && P(defaultPid) ? defaultPid : (focusId && P(focusId) ? focusId : order[0]);
      }
      openModal("taskModal");
      setTimeout(() => title.focus(), 30);
    }
    function confirmTask() {
      const title = document.getElementById("inputTaskTitle").value.trim();
      const pid = document.getElementById("selectTaskPlanet").value;
      const diff = parseInt(document.getElementById("selectTaskDiff").value, 10) || 2;
      const due = document.getElementById("inputTaskDue").value || "";
      const recur = document.getElementById("selectTaskRecur").value || "";
      if (!title) { document.getElementById("inputTaskTitle").focus(); return; }
      if (!P(pid)) return;
      if (editingTask) {
        const oldP = P(editingTask.pid), t = oldP?.tasks.find(x => x.id === editingTask.tid);
        if (t) {
          Object.assign(t, { title, diff, due, recur });
          if (editingTask.pid !== pid) {
            oldP.tasks = oldP.tasks.filter(x => x.id !== t.id);
            if (t.done && t.xpAwarded) { oldP.xp = Math.max(0, (oldP.xp || 0) - t.xpAwarded); P(pid).xp = (P(pid).xp || 0) + t.xpAwarded; }
            P(pid).tasks.push(t);
          }
          logEvent(pid, "renamed", `Edited task “${title}”`);
        }
      } else {
        P(pid).tasks.push({ id: uid("t"), title, diff, due, recur, streak: 0, history: [], done: false, doneAt: null, xpAwarded: 0 });
        logEvent(pid, "added", `Added ${recur ? (RECUR_LABEL[recur] + " ") : ""}task “${title}”`);
      }
      closeModal("taskModal");
      editingTask = null;
      sfx.add();
      commit();
    }

    // =========================================================================
    // 11. Toast
    // =========================================================================
    let toastTimer = null;
    function toast(text, color = "#2DD4BF") {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.style.borderColor = color + "66";
      el.style.boxShadow = `0 0 30px ${color}33`;
      el.classList.remove("hidden", "toast-show"); void el.offsetWidth; el.classList.add("toast-show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add("hidden"), 2400);
    }

    // =========================================================================
    // 12. Delegated event handling
    // =========================================================================
    document.addEventListener("click", (e) => {
      const el = e.target.closest("[data-act]");
      const topMenu = document.getElementById("topOverflowMenu");
      if (topMenu && !topMenu.classList.contains("hidden") && (!el || el.dataset.act !== "top-menu")) {
        topMenu.classList.add("hidden");
      }
      if (!el) {
        // Click on empty space clears the inspector selection
        if (selectedId && (e.target === document.body || e.target.id === "spaceCanvas")) { selectedId = null; updateSelectionVisuals(); renderHUD(); }
        return;
      }
      const d = el.dataset;
      switch (d.act) {
        case "dive": dive(d.id || null); break;
        case "clear-select": selectedId = null; updateSelectionVisuals(); renderHUD(); break;
        case "toggle": toggleTask(d.pid, d.tid); break;
        case "undo-cycle": undoRecurringCycle(d.pid, d.tid); break;
        case "edit-task": openTaskModal(null, { pid: d.pid, tid: d.tid }); break;
        case "del-task": deleteTask(d.pid, d.tid); break;
        case "add-task": openTaskModal(d.pid || null); break;
        case "add-sat": openForge(d.id || null); break;
        case "edit-planet": openEditPlanet(d.id || null); break;
        case "del-planet": closeModal("forgeModal"); deletePlanet(d.id); break;
        case "strain": toggleStrain(d.id, d.kind); break;
        case "tab": hudTab = d.tab; renderHUD(); renderMobile(); break;
        case "toggle-completed": showCompleted = !showCompleted; renderHUD(); renderMobile(); break;
        case "toggle-sheet": mobSheetSnap = mobSheetSnap === "peek" ? "expanded" : "peek"; renderMobile(); rebuildScene(); break;
        case "top-menu": topMenu?.classList.toggle("hidden"); break;
        case "mob-view": mobView = d.view; renderMobile(); rebuildScene(); document.getElementById("mobileView").scrollTop = 0; break;
        case "add-note": { const inp = document.getElementById(d.input); if (inp && inp.value.trim()) addNote(d.id || null, inp.value); break; }
        case "del-note": deleteNote(d.id || null, d.nid); break;
        case "sound": STATE.soundOn = !STATE.soundOn; save(); renderTopBar(); renderMobile(); if (STATE.soundOn) sfx.click(); break;
        case "sync-cloud":
          if (!currentUser) {
            toast("💾 Guest mode: saved locally on this device", "#E5A93C");
          } else {
            loadFromSupabase().then(() => toast("☁️ Cloud universe synced"));
          }
          break;
        case "login-google": signInWithGoogle(); break;
        case "login-email": signInWithEmail(false); break;
        case "signup-email": signInWithEmail(true); break;
        case "login-guest":
          guestMode = true;
          updateAuthUI();
          setCloudStatus("💾 Local only", "ok");
          toast("✦ Entered Guest Mode (Saved to this device only)");
          break;
        case "auth-btn":
          if (currentUser) {
            if (window.confirm("Sign out of your Idemap account?")) signOutUser();
          } else {
            guestMode = false;
            updateAuthUI();
          }
          break;
        case "pause": orbitPaused = !orbitPaused; el.textContent = orbitPaused ? "▶ Resume Orbit" : "⏸ Pause Orbit"; break;
        case "reset":
          if (window.confirm("Reset Idemap to the 4 empty seed planets (Home, Business, Social, Hobbies)? All current planets and tasks will be cleared.")) {
            STATE = seedState(); focusId = null; selectedId = null; save(); healthCache.clear(); render(); toast("Universe reset to 4 seed planets");
          }
          break;
        case "close-modal": closeModal(d.modal); break;
        case "forge-icon": forge.icon = d.v; renderForgePickers(); break;
        case "forge-color": forge.color = d.v; renderForgePickers(); break;
        case "forge-confirm": confirmForge(); break;
        case "task-confirm": confirmTask(); break;
        case "due-quick": document.getElementById("inputTaskDue").value = d.days === "" ? "" : addDays(parseInt(d.days, 10)); break;
      }
    });

    document.getElementById("inputForgeCustomIcon")?.addEventListener("input", (e) => {
      const val = e.target.value.trim();
      if (val) { forge.icon = val; renderForgePickers(); }
    });
    document.getElementById("inputForgeCustomColor")?.addEventListener("input", (e) => {
      if (e.target.value) { forge.color = e.target.value; renderForgePickers(); }
    });

    document.addEventListener("keydown", (e) => {
      const forgeOpen = !document.getElementById("forgeModal").classList.contains("hidden");
      const taskOpen = !document.getElementById("taskModal").classList.contains("hidden");
      if (e.key === "Escape") {
        if (forgeOpen) closeModal("forgeModal");
        else if (taskOpen) closeModal("taskModal");
        else if (selectedId) { selectedId = null; updateSelectionVisuals(); renderHUD(); }
      }
      if (e.key === "Enter" && !e.shiftKey && e.target.tagName !== "TEXTAREA") {
        if (forgeOpen) { e.preventDefault(); confirmForge(); }
        else if (taskOpen) { e.preventDefault(); confirmTask(); }
      }
    });

    // Close modals by clicking the dimmed backdrop
    ["forgeModal", "taskModal"].forEach(id => document.getElementById(id).addEventListener("click", (e) => { if (e.target.id === id) closeModal(id); }));

    // =========================================================================
    // 13. Background starfield + animation loop
    // =========================================================================
    const bgCanvas = document.getElementById("spaceCanvas");
    const bgCtx = bgCanvas.getContext("2d");
    let stars = [];
    let wasMobile = isMobile();
    function initStars() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      bgCanvas.width = window.innerWidth * dpr; bgCanvas.height = window.innerHeight * dpr;
      bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.min(240, Math.floor((window.innerWidth * window.innerHeight) / 7000));
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight,
        r: Math.random() * 1.4 + 0.3, o: Math.random() * 0.5 + 0.15, s: Math.random() * 0.02 + 0.005,
      }));
    }
    let resizeTimer = null;
    window.addEventListener("resize", () => {
      initStars();
      const m = isMobile();
      if (m !== wasMobile) { wasMobile = m; render(); return; }
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { rebuildScene(); }, 150);
    });
    initStars();

    // Touch gesture to rotate orbits on mobile & pause drift on touch interaction
    let touchStartX = null;
    let touchStartY = null;
    let touchStartOffset = 0;
    let isTouchDragging = false;
    let lastTouchTime = 0;

    window.addEventListener("touchstart", (e) => {
      lastTouchTime = Date.now();
      if (!isMobile() || mobView !== "orbit") return;
      if (e.touches.length === 1 && !e.target.closest("button") && !e.target.closest(".node-inner")) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartOffset = orbitOffset;
        isTouchDragging = true;
      }
    }, { passive: true });

    window.addEventListener("touchmove", (e) => {
      lastTouchTime = Date.now();
      if (isTouchDragging && e.touches.length === 1) {
        const dx = e.touches[0].clientX - touchStartX;
        orbitOffset = touchStartOffset + dx * 0.45;
        updateOrbitalPositions();
      }
    }, { passive: true });

    window.addEventListener("touchend", () => {
      isTouchDragging = false;
      lastTouchTime = Date.now();
    });
    window.addEventListener("touchcancel", () => {
      isTouchDragging = false;
      lastTouchTime = Date.now();
    });

    let tick = 0, lastT = performance.now();
    function animateLoop(now) {
      const dt = Math.min(64, (now || performance.now()) - lastT); lastT = now || performance.now();
      tick += 1;
      const isTouchPausing = (Date.now() - lastTouchTime) < 2200;
      if (!orbitPaused && !hoveringNode && !selectedId && !isTouchDragging && !isTouchPausing) orbitOffset = (orbitOffset + dt * 0.0033) % 360;
      const w = window.innerWidth, h = window.innerHeight;
      const mobile = isMobile();
      const { cx, cy } = mobile ? { cx: w / 2, cy: h * 0.31 } : geom();

      bgCtx.fillStyle = "#0D0F0E";
      bgCtx.fillRect(0, 0, w, h);
      const grad = bgCtx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(w, h) * 0.48);
      grad.addColorStop(0, "rgba(45, 212, 191, 0.07)");
      grad.addColorStop(0.5, "rgba(45, 212, 191, 0.02)");
      grad.addColorStop(1, "transparent");
      bgCtx.fillStyle = grad;
      bgCtx.fillRect(0, 0, w, h);
      for (const st of stars) {
        const a = st.o * (0.65 + 0.35 * Math.sin(tick * st.s + st.x));
        bgCtx.beginPath();
        bgCtx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        bgCtx.fillStyle = `rgba(226,232,240,${a})`;
        bgCtx.fill();
      }
      if (!mobile || mobView === "orbit") updateOrbitalPositions();
      requestAnimationFrame(animateLoop);
    }

    async function consumeOAuthCallbackFromUrl() {
      if (!sbClient) return false;
      const wins = [window];
      try {
        if (window.top && window.top !== window && window.top.location) wins.unshift(window.top);
      } catch (e) {}

      for (const w of wins) {
        try {
          const rawHash = w.location.hash || "";
          const rawSearch = w.location.search || "";
          if (rawHash && rawHash.length > 1) {
            const hp = new URLSearchParams(rawHash.replace(/^#/, ""));
            const errDesc = hp.get("error_description") || hp.get("error");
            if (errDesc) {
              showAuthError(esc(errDesc));
              w.history.replaceState(null, "", w.location.pathname);
              return false;
            }
            const access_token = hp.get("access_token");
            const refresh_token = hp.get("refresh_token");
            if (access_token && refresh_token) {
              const { data, error } = await sbClient.auth.setSession({ access_token, refresh_token });
              w.history.replaceState(null, "", w.location.pathname);
              if (!error && data?.session?.user) {
                currentUser = data.session.user;
                activeAccessToken = data.session.access_token || SUPABASE_KEY;
                updateAuthUI();
                STATE = loadState();
                focusId = null; selectedId = null;
                render();
                await loadFromSupabase();
                toast(`✦ Welcome, ${currentUser.user_metadata?.full_name || currentUser.email || "Explorer"}!`);
                return true;
              }
            }
          }
          if (rawSearch && rawSearch.length > 1) {
            const sp = new URLSearchParams(rawSearch);
            const errDesc = sp.get("error_description") || sp.get("error");
            if (errDesc) {
              showAuthError(esc(errDesc));
              w.history.replaceState(null, "", w.location.pathname);
              return false;
            }
            const code = sp.get("code");
            if (code) {
              const { data, error } = await sbClient.auth.exchangeCodeForSession(code);
              w.history.replaceState(null, "", w.location.pathname);
              if (!error && data?.session?.user) {
                currentUser = data.session.user;
                activeAccessToken = data.session.access_token || SUPABASE_KEY;
                updateAuthUI();
                STATE = loadState();
                focusId = null; selectedId = null;
                render();
                await loadFromSupabase();
                toast(`✦ Welcome, ${currentUser.user_metadata?.full_name || currentUser.email || "Explorer"}!`);
                return true;
              }
            }
          }
        } catch (e) {}
      }
      return false;
    }

    async function initAuth() {
      if (!sbClient) {
        updateAuthUI();
        return;
      }
      sbClient.auth.onAuthStateChange((event, session) => {
        const hadUser = !!currentUser;
        currentUser = session?.user || null;
        activeAccessToken = session?.access_token || SUPABASE_KEY;
        updateAuthUI();
        if (currentUser && (!hadUser || event === "SIGNED_IN")) {
          STATE = loadState();
          focusId = null; selectedId = null;
          render();
          loadFromSupabase();
        } else if (!currentUser) {
          setCloudStatus("💾 Local only", "ok");
        }
      });

      window.addEventListener("hashchange", () => { consumeOAuthCallbackFromUrl(); });
      try {
        if (window.top && window.top !== window) {
          window.top.addEventListener("hashchange", () => { consumeOAuthCallbackFromUrl(); });
        }
      } catch (e) {}

      // 1. Check if Google OAuth redirected back with #access_token or ?code on top window or iframe
      const handledCallback = await consumeOAuthCallbackFromUrl();
      if (handledCallback) return;

      // 2. Otherwise check existing persisted Supabase session
      const { data } = await sbClient.auth.getSession();
      if (data?.session?.user) {
        currentUser = data.session.user;
        activeAccessToken = data.session.access_token || SUPABASE_KEY;
        updateAuthUI();
        loadFromSupabase();
      } else {
        updateAuthUI();
        setCloudStatus("💾 Local only", "ok");
      }
    }

    render();
    initAuth();
    requestAnimationFrame(animateLoop);
  </script>
</body>
</html>
