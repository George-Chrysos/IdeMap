services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: idemap-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Athens
      - TZ=Europe/Athens
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://fzynqetgqohgeqsdnttm.supabase.co}
      - SUPABASE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-sb_publishable_h5qp70G8q8wVfI9QrFa7mw_hiflEA4i}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

volumes:
  n8n_data:
